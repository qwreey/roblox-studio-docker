# code-docker 와 나란히 띄울 때만 쓰는 오버레이 파일 — 단독 실행용 docker-compose.yml은
# 이 파일 때문에 손댈 필요가 없다 (그게 이 파일이 존재하는 이유 전부). code-docker 쪽의
# extra-include.yml → 이 파일 순서로 include 체인을 타고 들어오는 용도로만 쓰인다 -
# `docker compose -f roblox-studio-code-docker.yml up` 처럼 이 파일 하나만 단독 실행하는
# 건 지원 대상이 아니다 (아래 `code-docker-internal`/`code-docker-router` 는 code-docker
# 자신의 docker-compose.yml에만 정의돼 있어서, 그게 같은 include 체인 안에 없으면 존재하지
# 않는 네트워크/서비스를 참조하는 걸로 실패한다).
#
# 전체 설계/이유는 code-docker-integration-plan.md 참고. Phase 1(code-docker-internal
# 부착)에 이어 Phase 2(VNC 전용 네트워크 격리)까지 반영됨 - code-docker 쪽
# .claude/backlog/roblox-studio-vnc-isolation-plan.md에서 실측 검증까지 마친 설계.
include:
  - path: docker-compose.yml

services:
  studio:
    # code-docker의 netinit-docker(호스트측 에이전트)가 이 컨테이너를 자기 관리 대상으로
    # 인식하게 하는 opt-in 라벨. 이 라벨 하나가 전부고, 게이트웨이가 어디인지는 여기가
    # 아니라 네트워크 쪽(code-docker의 docker-compose.yml에 있는 code-docker-internal의
    # netinit.gateway 라벨)이 선언한다 - studio처럼 여러 망에 붙은 컨테이너도 "게이트웨이를
    # 선언한 망"이 곧 egress 경로라 컨테이너 쪽에 따로 쓸 게 없고, 게이트웨이를 선언하지
    # 않은 망(아래 roblox-studio-vnc)은 워크로드가 붙어도 egress 경로가 되지 않는다.
    # 매칭은 fail-closed - 라벨이 없으면 어떤 에이전트도 이 컨테이너를 건드리지 않는다.
    labels:
      netinit.provider: "${PREFIX:-}code-docker-netinit-docker"
    environment:
      # 위 라벨의 짝. netinit-docker는 호스트 쪽에서 도는 에이전트라 이 컨테이너가 뜬
      # *뒤에* 라우트를 심을 수밖에 없으므로, entrypoint.sh가 default route가 생길 때까지
      # 막고 기다린다(권한 불필요, 읽기 전용). 안 그러면 Studio가 egress 정책이 자리잡기
      # 전에 이미 돌고 있는 창이 생기고, Studio는 HTTPService/플러그인으로 임의 아웃바운드가
      # 되는 물건이라 그 창이 곧 router 경계의 구멍이다. 단독 실행(router 없음)에서는
      # 기다릴 provider가 없으므로 entrypoint 쪽 기본값이 off고, 이 오버레이에서만 켠다.
      NETINIT_WAIT: "true"
      # 이 컨테이너는 code-docker 쪽에 붙으면 `internal: true` 네트워크에만 올라가고,
      # 거기서 Docker 내장 DNS(127.0.0.11)는 같은 네트워크 이름만 답하고 그 밖의 이름은
      # 즉시 확정적 SERVFAIL로 거절한다 - 포워딩할 경로가 없으니까. 그래서 외부 DNS가
      # 통째로 없어지고(실측 2026-08-27: clientsettings.roblox.com 15회 전부 실패),
      # Vinegar가 "Temporary failure in name resolution"으로 기동에 실패한다.
      # dns-local은 127.0.0.11과 router를 strict-order로 물린 로컬 dnsmasq를 띄워
      # 이걸 한 곳에서 해결한다 - router만 가리키면 안 되는 이유(VNC_BIND_ALIAS가
      # getent로 fail-closed 바인딩한다)까지 config/supervisor/dns-local-service.sh 참고.
      # 단독 실행에는 router가 없으므로 그쪽 기본값은 off고, 이 오버레이에서만 켠다 -
      # 위 NETINIT_WAIT과 정확히 같은 모양.
      DNS_LOCAL_ENABLED: "true"
      # wayvnc가 0.0.0.0 대신 이 별칭이 resolve된 IP에만 바인딩하게 함 (fail-closed -
      # entrypoint.sh 쪽 wayvnc-service.sh 참고). 아래 networks.roblox-studio-vnc.aliases와
      # 반드시 일치해야 함 - studio 자신의 이름이 아니라 roblox-studio-vnc 위에서만
      # 존재하는 전용 별칭이어야 한다(그래야 code-docker-internal 쪽 IP로 잘못
      # resolve될 여지가 없음).
      VNC_BIND_ALIAS: vnc-only
    networks:
      # code-docker-internal에 붙이는 것만으로 코드가 뭔가 자동으로 되는 건 없다 -
      # 이 네트워크 위에서 code-docker 쪽 에이전트 컨테이너가 실제로 Studio MCP
      # 브리지(SETUP.md의 "Studio MCP over the network")나 HTTPService를 호출하게
      # 배선하는 건 여전히 별도의, 아직 안 된 작업이다 (CLAUDE.md의 "Future
      # code-docker integration" 절 참고) - 이 파일은 그 작업이 가능해지도록 네트워크
      # 경로만 미리 열어두는 것.
      code-docker-internal: {}
      # VNC 전용, agent 컨테이너(code-docker/dind)는 못 붙는 격리망 - 아래
      # networks.roblox-studio-vnc 정의 참고.
      roblox-studio-vnc:
        aliases:
          - vnc-only
    # docker-compose.yml의 ports: (VNC_PORT/VNC_WEB_PORT/MCP_PORT 전부 host 게시)를
    # 통째로 비운다. VNC_PORT/VNC_WEB_PORT는 격리가 목적이라 당연하고(noVNC 웹 UI도
    # wayvnc와 같은 VNC_BIND_ALIAS 대상이라 code-docker-router의 App Routes로만
    # 노출됨 - novnc-service.sh 참고), MCP_PORT도 사실 여기선 게시할 필요가 없다 -
    # 실측 확인(2026-08-18): code-docker와 통합된 상태에서 studio는
    # code-docker-internal/roblox-studio-vnc 둘 다 internal: true라 non-internal
    # 네트워크가 하나도 없고, Docker는 그런 컨테이너의 host publish DNAT를 조용히
    # 건너뛴다 - 즉 예전 `ports: !override - MCP_PORT` 설정은 실제로는 아무것도 게시하지
    # 못하고 있었다(에러도 없이). MCP 브리지의 실제 소비 경로는 애초에 host publish가
    # 아니라 code-docker 자신의 에이전트 컨테이너가 code-docker-internal 위에서
    # `studio:8787`로 직접 붙는 것(위 networks 주석 참고, SETUP.md "Studio MCP over the
    # network") - 이게 실측으로 정상 동작 확인됨. code-docker 바깥에서 MCP에 접근할
    # 필요가 생기면 host publish를 되살리는 대신 code-docker-router의 netgate
    # `forwards:`(VNC와 동일한 방식, docs/egress-netgate.md 참고)나 Dev
    # Proxy/App Routes로 노출하는 쪽이 이 프로젝트의 "국경은 router만" 원칙과 일관된다.
    # (`!reset`은 완전히 비우기 전용 태그라 뒤에 값을 써도 무시되고 통째로 사라진다는 걸
    # `docker compose config`로 직접 확인함 - 빈 리스트 하나만 필요하므로 여기선 그게 맞는
    # 태그.)
    ports: !reset []
  # (구) studio-netinit 사이드카는 제거됨 - code-docker의 netinit-docker(호스트측
  # 라벨 기반 에이전트)가 그 역할을 대신한다. 이유: `network_mode: service:studio`는
  # 컴포즈가 studio의 *컨테이너 ID*로 고정해서 저장하기 때문에, studio가 제자리 restart가
  # 아니라 recreate(새 ID)되는 순간 사이드카가 사라진 netns에 붙으려다 영구히 시작 실패
  # 상태가 된다("No such container: <old-id>"). 게다가 studio 자신은 계속 Up이라 아무
  # 신호 없이 조용히 인터넷만 끊긴다 - 2026-08-25에 실제로 9시간 동안 그 상태였다.
  # netinit-docker는 컨테이너 ID를 붙잡아두는 지점이 없어서(매 사이클 SandboxKey 재조회)
  # 이 실패 클래스 자체가 없다. 설계 전문은 code-docker 쪽
  # .claude/backlog/netinit-docker-plan.md 참고.
  #
  # 사이드카가 갖고 있던 NET_ADMIN이 studio로 옮겨간 게 아니라는 점이 중요하다 - studio는
  # 여전히 capability가 0개이고, 라우트를 심는 권한은 컨테이너 바깥에만 있다. 그 분리가
  # 이 구조의 목적 전부다.

  # code-docker 쪽에 이미 정의된 서비스에 필드만 추가 병합 (include 병합은 서비스
  # 이름 기준으로 동작 - "이 파일에서 정의한 서비스만" 이라는 제약 없음, code-docker
  # 쪽에서 실측 검증됨). router가 roblox-studio-vnc에도 붙어야 forwards:로
  # VNC(5900)를 host에 안전하게 중계할 수 있다 - 실제 forward 항목(host_port ->
  # vnc-only:5900) 추가는 컴포즈 파일이 아니라 router-manager의 Net 관리
  # 탭/API(/api/netgate/forwards)에서 런타임에 하는 것 - docs/router.md 참고.
  code-docker-router:
    networks:
      - roblox-studio-vnc

networks:
  # agent 컨테이너(code-docker/dind)는 절대 못 붙는, VNC 전용 격리망 - router만
  # studio와 같이 붙어서 사람에게 VNC를 중계한다("국경은 router만" 원칙, code-docker
  # 쪽 CLAUDE.md 참고). name: 없이 두면 Compose가 프로젝트 이름을 붙여
  # "code-docker_roblox-studio-vnc"로 만든다 - 아래 `netinit.exempt-forward` 라벨
  # 경로(현재 기본)는 이름과 무관하게 라벨 필터로 이 네트워크를 찾아내므로 그 자체는
  # 더 이상 이름 고정을 요구하지 않지만, ${PREFIX}도 code-docker 자신의 네트워크
  # (code-docker-internal 등)와 동일하게 여기 꿰어 넣어야 하는 이유는 남아있다 - 안
  # 그러면 PREFIX가 다른 code-docker 인스턴스 두 개가 각자 roblox-studio-docker를
  # 연동해도 이 network 하나를 공유해버려서(둘 다 그냥 "roblox-studio-vnc"), 서로
  # 다른 배포의 router/studio가 같은 VNC 격리망에 섞이게 된다. 아직 라벨로 옮기지
  # 않은 매니페스트를 위한 호환 경로(`NETFILTER_FIX_EXTRA_INTERNAL_NETWORKS`,
  # example-env 참고)는 여전히 compose가 만든 실제 이름을 `docker network inspect`로
  # 그대로 찾아보는 방식이라, 그 경로를 쓰는 동안은 이름 고정이 필수다(실측 확인:
  # 2026-08-18, 옛 code-docker-netfilter-fix가 이 이름 없이는 "not up yet"만 반복
  # 출력). 이 값은 code-docker 쪽 최상위 `.env`(docker compose를 실행하는
  # 디렉터리)에서 substitution되므로, ootb.sh로 연동했고 아직 호환 경로를 쓰고
  # 있다면 ootb-extra.sh가 NETFILTER_FIX_EXTRA_INTERNAL_NETWORKS에 같은 PREFIX를
  # 붙여서 저장해준다(ootb-manifest.env의 OOTB_EXTRA_INTERNAL_NETWORKS 참고) - 수동
  # 연동이라면 사람이 직접 두 값을 맞춰야 한다.
  roblox-studio-vnc:
    name: "${PREFIX:-}roblox-studio-vnc"
    internal: true
    # code-docker 쪽 .env의 NETFILTER_FIX_EXTRA_INTERNAL_NETWORKS를 대체한다. 예전에는
    # 이 망의 이름을 code-docker의 .env에 손으로 적어줘야 했는데 - 형제 프로젝트를 붙일
    # 때마다 code-docker 쪽 파일을 고치는 건 EXTRA_INCLUDE가 없애려던 결합 그 자체였다 -
    # 이제 필요한 쪽이 자기 망에 직접 선언한다. ootb-extra.sh가 PREFIX를 그 env에 맞춰
    # 넣어주던 동기화도 이걸로 불필요해진다.
    #
    # netinit.gateway는 일부러 없다: 여기는 사람에게 VNC를 중계하는 격리망이지 egress
    # 경로가 아니고, 게이트웨이를 선언하지 않은 망은 netinit-docker가 라우트 대상으로
    # 삼지 않는다.
    labels:
      netinit.provider: "${PREFIX:-}code-docker-netinit-docker"
      netinit.exempt-forward: "true"
