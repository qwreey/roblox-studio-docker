# code-docker 와 나란히 띄울 때만 쓰는 오버레이 파일 — 단독 실행용 docker-compose.yml은
# 이 파일 때문에 손댈 필요가 없다 (그게 이 파일이 존재하는 이유 전부). code-docker 쪽의
# extra-include.yml → 이 파일 순서로 include 체인을 타고 들어오는 용도로만 쓰인다 -
# `docker compose -f roblox-studio-code-docker.yml up` 처럼 이 파일 하나만 단독 실행하는
# 건 지원 대상이 아니다 (아래 `code-docker-internal`/`code-docker-router` 는 code-docker
# 자신의 docker-compose.yml에만 정의돼 있어서, 그게 같은 include 체인 안에 없으면 존재하지
# 않는 네트워크/서비스를 참조하는 걸로 실패한다).
#
# 전체 설계/이유는 code-docker-integration-plan.md 참고. Phase 1(code-docker-internal
# 부착)에 이어 Phase 2(VNC 전용 네트워크 격리)까지 반영됨 - code-docker 쪽
# .claude/backlog/roblox-studio-vnc-isolation-plan.md에서 실측 검증까지 마친 설계.
include:
  - path: docker-compose.yml

services:
  studio:
    environment:
      # wayvnc가 0.0.0.0 대신 이 별칭이 resolve된 IP에만 바인딩하게 함 (fail-closed -
      # entrypoint.sh 쪽 wayvnc-service.sh 참고). 아래 networks.roblox-studio-vnc.aliases와
      # 반드시 일치해야 함 - studio 자신의 이름이 아니라 roblox-studio-vnc 위에서만
      # 존재하는 전용 별칭이어야 한다(그래야 code-docker-internal 쪽 IP로 잘못
      # resolve될 여지가 없음).
      VNC_BIND_ALIAS: vnc-only
    networks:
      # code-docker-internal에 붙이는 것만으로 코드가 뭔가 자동으로 되는 건 없다 -
      # 이 네트워크 위에서 code-docker 쪽 에이전트 컨테이너가 실제로 Studio MCP
      # 브리지(SETUP.md의 "Studio MCP over the network")나 HTTPService를 호출하게
      # 배선하는 건 여전히 별도의, 아직 안 된 작업이다 (CLAUDE.md의 "Future
      # code-docker integration" 절 참고) - 이 파일은 그 작업이 가능해지도록 네트워크
      # 경로만 미리 열어두는 것.
      code-docker-internal: {}
      # VNC 전용, agent 컨테이너(code-docker/dind)는 못 붙는 격리망 - 아래
      # networks.roblox-studio-vnc 정의 참고.
      roblox-studio-vnc:
        aliases:
          - vnc-only
    # docker-compose.yml의 ports: (VNC_PORT/VNC_WEB_PORT/MCP_PORT 전부 host 게시)를
    # 통째로 비운다. VNC_PORT/VNC_WEB_PORT는 격리가 목적이라 당연하고(noVNC 웹 UI도
    # wayvnc와 같은 VNC_BIND_ALIAS 대상이라 code-docker-router의 App Routes로만
    # 노출됨 - novnc-service.sh 참고), MCP_PORT도 사실 여기선 게시할 필요가 없다 -
    # 실측 확인(2026-08-18): code-docker와 통합된 상태에서 studio는
    # code-docker-internal/roblox-studio-vnc 둘 다 internal: true라 non-internal
    # 네트워크가 하나도 없고, Docker는 그런 컨테이너의 host publish DNAT를 조용히
    # 건너뛴다 - 즉 예전 `ports: !override - MCP_PORT` 설정은 실제로는 아무것도 게시하지
    # 못하고 있었다(에러도 없이). MCP 브리지의 실제 소비 경로는 애초에 host publish가
    # 아니라 code-docker 자신의 에이전트 컨테이너가 code-docker-internal 위에서
    # `studio:8787`로 직접 붙는 것(위 networks 주석 참고, SETUP.md "Studio MCP over the
    # network") - 이게 실측으로 정상 동작 확인됨. code-docker 바깥에서 MCP에 접근할
    # 필요가 생기면 host publish를 되살리는 대신 code-docker-router의 netgate
    # `forwards:`(VNC와 동일한 방식, docs/egress-netgate.md 참고)나 Dev
    # Proxy/App Routes로 노출하는 쪽이 이 프로젝트의 "국경은 router만" 원칙과 일관된다.
    # (`!reset`은 완전히 비우기 전용 태그라 뒤에 값을 써도 무시되고 통째로 사라진다는 걸
    # `docker compose config`로 직접 확인함 - 빈 리스트 하나만 필요하므로 여기선 그게 맞는
    # 태그.)
    ports: !reset []
  # code-docker/dind와 동일한 netinit 패턴 - studio는 code-docker와 같은 신뢰 등급의
  # 개발용 컨테이너로 취급한다(Roblox Studio 자체에 HTTPService/plugin 권한이 있어
  # 임의 아웃바운드가 가능함) - /dev/dri 때문에 별도 컨테이너로만 분리했을 뿐 네트워크
  # 처우는 code-docker와 같게 간다는 결정 (2026-08-13, code-docker 쪽
  # roblox-studio-vnc-isolation-plan.md 참고). studio가 code-docker-internal에도
  # 붙어 있으므로(Phase 1) ROUTER_HOSTNAME은 code-docker 쪽이 이미 그 네트워크에 걸어둔
  # "router" 별칭을 그대로 재사용 - roblox-studio-vnc 쪽에 별도 별칭을 추가할 필요
  # 없음(router가 어느 인터페이스로 studio의 다음 홉을 받든 자기 자신의 라우팅
  # 테이블로 알아서 올바르게 처리함 - code-docker 쪽에서 실측 확인됨).
  studio-netinit:
    build:
      context: netinit
    network_mode: service:studio
    cap_add:
      - NET_ADMIN
    environment:
      ROUTER_HOSTNAME: "${ROUTER_HOSTNAME:-router}"
    depends_on:
      studio:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # code-docker 쪽에 이미 정의된 서비스에 필드만 추가 병합 (include 병합은 서비스
  # 이름 기준으로 동작 - "이 파일에서 정의한 서비스만" 이라는 제약 없음, code-docker
  # 쪽에서 실측 검증됨). router가 roblox-studio-vnc에도 붙어야 forwards:로
  # VNC(5900)를 host에 안전하게 중계할 수 있다 - 실제 forward 항목(host_port ->
  # vnc-only:5900) 추가는 컴포즈 파일이 아니라 router-manager의 Net 관리
  # 탭/API(/api/netgate/forwards)에서 런타임에 하는 것 - docs/router.md 참고.
  code-docker-router:
    networks:
      - roblox-studio-vnc

networks:
  # agent 컨테이너(code-docker/dind)는 절대 못 붙는, VNC 전용 격리망 - router만
  # studio와 같이 붙어서 사람에게 VNC를 중계한다("국경은 router만" 원칙, code-docker
  # 쪽 CLAUDE.md 참고). name: 없이 두면 Compose가 프로젝트 이름을 붙여
  # "code-docker_roblox-studio-vnc"로 만드는데, code-docker 쪽
  # CODE_DOCKER_EXTRA_INTERNAL_NETWORKS(example-env 참고)는 접두사 없는 순수
  # 네트워크 이름을 기대한다(code-docker-internal/external 자신이 항상 그렇듯) -
  # 이 network만 예외가 되지 않도록 명시적으로 이름을 고정한다(실측 확인: 2026-08-18,
  # code-docker-netfilter-fix가 이 이름 없이는 "not up yet"만 반복 출력).
  roblox-studio-vnc:
    name: roblox-studio-vnc
    internal: true
