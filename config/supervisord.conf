[supervisord]
loglevel=info
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# One [program:...] file per process under config/supervisord.d/ (matching
# code-docker's own split, see its config/supervisord.default.conf) - no second
# gitignored override glob like code-docker has, since this project doesn't have
# a user-config-override mechanism anywhere else either (unlike code-docker).
[include]
files = /etc/roblox-studio/supervisord.d/*.conf
