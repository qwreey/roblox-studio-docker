[studio]
# Vinegar's own WebView2 install is left disabled by default. Roblox Studio's embedded
# WebView2 login page loads correctly at the network level under this container's
# headless-Wayland setup but renders as a blank/broken window (a known Wine+WebView2-on-
# Wayland compositing bug, not fixable from this side) — with the WebView install
# disabled, Studio correctly falls back to its native "Login via Browser" flow instead,
# which is the path that actually works here. See CLAUDE.md's "Milestone 3" section
# before re-enabling this.
webview = ""

# Pin Wine to the build baked in at /opt/kombucha-pinned instead of letting Vinegar
# download the current Kombucha release — why, and which release, is the Dockerfile's
# own KOMBUCHA_VERSION block. The pin moves with the image; this line never has to.
#
# Note this file is only seeded on first run (entrypoint.sh never overwrites an existing
# config.toml), so an already-deployed instance that predates the pin needs this line
# added by hand.
wineroot = "/opt/kombucha-pinned"
