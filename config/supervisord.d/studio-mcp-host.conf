# Not in critical-watchdog.conf's CRITICAL_PROGRAMS: without it agents still reach Studio,
# only a little later after each new session (see the script's header).
[program:studio-mcp-host]
command=/etc/roblox-studio/studio-mcp-host-service.sh
priority=110
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
