# priority=5 - before everything else. Nothing here strictly blocks on DNS at
# supervisord start (Studio is launched later, by a person, from the desktop),
# but this is the program every other one's network access depends on, so it
# goes first on principle rather than by luck.
#
# Deliberately NOT in critical-watchdog.conf's CRITICAL_PROGRAMS list, and
# autorestart=true: a resolver blip must never take down labwc/wayvnc/Studio,
# and the script's own upkeep loop already survives router being recreated.
# Same reasoning mcp-bridge.conf spells out for itself.
[program:dns-local]
command=/etc/roblox-studio/dns-local-service.sh
priority=5
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
