# priority=999 - starts last, after dbus/labwc/wayvnc are already at least underway, so
# its own startup grace period (see critical-watchdog-service.sh) isn't fighting normal
# spawn latency. autorestart=true: if the watchdog itself dies, nothing would notice a
# later labwc/wayvnc/dbus crash, so it needs to self-heal.
[program:critical-watchdog]
command=/etc/roblox-studio/critical-watchdog-service.sh
priority=999
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
