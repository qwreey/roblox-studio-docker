# One-shot (see the script): exits once the plugins are in place, so no restart. Not
# critical: without it, studio-sync finds no Studio to answer it and VS Code gets no
# DataModel for autocompletion.
[program:studio-plugins]
command=/etc/roblox-studio/studio-plugins-service.sh
priority=40
autorestart=false
startsecs=0
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
