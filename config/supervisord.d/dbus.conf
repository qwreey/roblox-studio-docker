# priority=10 - starts before labwc/wayvnc, since labwc-service.sh's post-start step
# needs a live session bus to push WAYLAND_DISPLAY into (dbus-update-activation-environment).
#
# autorestart=false + startretries=0: a first failure should surface immediately to
# critical-watchdog.conf's polling program, not be quietly retried - see that program's
# own comment for the full "container dies if this dies" reasoning.
[program:dbus]
command=/etc/roblox-studio/dbus-service.sh
priority=10
autorestart=false
startretries=0
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
