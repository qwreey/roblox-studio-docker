# Deliberately NOT in critical-watchdog.conf's CRITICAL_PROGRAMS list - a bridge crash
# must never take down labwc/wayvnc/Studio (matches the old entrypoint.sh's own comment:
# "excluded from that `wait -n` set, since it's non-critical and already self-restarting
# on its own"). autorestart=true here is an extra safety net on top of
# mcp-bridge.sh's own internal supergateway/caddy restart loop, for the rarer case where
# the wrapper script itself dies rather than just one of its children.
[program:mcp-bridge]
command=/etc/roblox-studio/mcp-bridge-service.sh
priority=100
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
