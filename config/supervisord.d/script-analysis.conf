# Not in critical-watchdog.conf's CRITICAL_PROGRAMS: without it only `studio-analysis` in
# code-docker stops working.
[program:script-analysis]
command=/usr/local/lib/roblox-studio/script-analysis-service.py
priority=40
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
