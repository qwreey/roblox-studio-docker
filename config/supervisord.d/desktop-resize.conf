# Not in critical-watchdog.conf's CRITICAL_PROGRAMS: if this dies, Studio's desktop only
# stops following the screen size - no reason to take labwc/wayvnc/Studio down with it.
[program:desktop-resize]
command=/etc/roblox-studio/desktop-resize-service.sh
priority=40
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
