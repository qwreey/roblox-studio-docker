# Not in critical-watchdog.conf's CRITICAL_PROGRAMS: without it Studio only loses a
# window-stacking fix, no reason to take labwc/wayvnc/Studio down. autorestart=true so it
# reconnects if XWayland goes away and comes back.
[program:wine-owned-popups]
command=/etc/roblox-studio/wine-owned-popups-service.sh
priority=40
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
