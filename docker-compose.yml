services:
  studio:
    build:
      context: .
    container_name: roblox-studio
    ports:
      - "${VNC_PORT:-5900}:5900"
      - "${VNC_WEB_PORT:-6080}:6080"
      - "${MCP_PORT:-8787}:8787"
    devices:
      - /dev/dri:/dev/dri
    cap_add:
      - SYS_NICE
    # Docker's default 64MB /dev/shm is far too small for Chromium (and likely for Wine/
    # Roblox Studio too) — causes net::ERR_INSUFFICIENT_RESOURCES on many resource loads
    # even though the exact same URL loads fine outside the container.
    shm_size: '2gb'
    volumes:
      # Vinegar/Wine state — Kombucha Wine build, Roblox Studio install, Wine prefixes.
      # Without this, every container recreate (not just rebuild) re-downloads
      # everything from scratch and loses Roblox login state.
      - ./data/vinegar-data:/root/.local/share/vinegar
      - ./data/vinegar-config:/root/.config/vinegar
      - ./data/vinegar-cache:/root/.cache/vinegar
      # wayvnc's RSA-AES key + self-signed VeNCrypt/TLS cert (see entrypoint.sh) — kept
      # stable across restarts so clients don't see a "host key changed" warning.
      - ./data/wayvnc:/root/.config/wayvnc
    environment:
      VNC_PORT: "5900"
      # noVNC/websockify's HTTP+WebSocket front end for the same wayvnc session — see
      # CLAUDE.md's "VNC embedding" section. Container-internal listen port (mirrors the
      # VNC_PORT pattern) — override the host-side port via the ports mapping's
      # ${VNC_WEB_PORT:-6080} instead, not this value.
      VNC_WEB_PORT: "6080"
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      # Unset by default — see entrypoint.sh's VNC_BIND_ALIAS handling and CLAUDE.md's
      # "VNC_BIND_ALIAS" section. Only needed when attaching this container to multiple
      # Docker networks (e.g. a future code-docker integration) and VNC must be bound to
      # one specific network's IP rather than 0.0.0.0. Applies to both wayvnc's raw RFB
      # port and websockify's noVNC web port (see novnc-service.sh) — one variable
      # segments both paths identically.
      VNC_BIND_ALIAS: "${VNC_BIND_ALIAS:-}"
      # MCP bridge (mcp-bridge.sh) — NOT auto-started by entrypoint.sh, see that script's
      # own header comment and SETUP.md's "Studio MCP over the network" section. MCP_PORT
      # here is the fixed container-internal Caddy listen port (mirrors the VNC_PORT
      # pattern above) — override the host-side port via the ports mapping's
      # ${MCP_PORT:-8787} instead, not this value.
      MCP_PORT: "8787"
      MCP_TOKEN: "${MCP_TOKEN:-}"
      STUDIO_MCP_STDIO_CMD: "${STUDIO_MCP_STDIO_CMD:-}"
    restart: unless-stopped
